name: docs-integrity

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "scripts/validate_docs.py"
      - ".github/workflows/docs-integrity.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/**"
      - "scripts/validate_docs.py"
      - ".github/workflows/docs-integrity.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate POD DOCSET
        run: python scripts/validate_docs.py

      - name: Test validator failure detection
        run: python -m unittest discover -s tests -v
