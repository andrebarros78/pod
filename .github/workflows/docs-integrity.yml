name: POD Governance Integrity

on:
  push:
  pull_request:

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate canonical governance
        run: python3 scripts/validate_governance.py
      - name: Run governance regression tests
        run: python3 -m unittest discover -s tests -v
